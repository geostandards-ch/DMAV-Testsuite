name: DMAV-Gebaeudeadressen

on:
  pull_request:
    types: [opened, closed]  
    
  workflow_dispatch:

jobs:
  test-failcases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run DMAV_Gebaeudeadressen_V1_1
        run: java -jar ./_Runner/interlis-testbed-runner-1.0.1/lib/interlis-testbed-runner-1.0.1-SNAPSHOT.jar -v ./_Runner/ilivalidator-1.15.0/ilivalidator-1.15.0.jar --config ./Testsuite_DMAV/DMAV_V1_1_Gebaeudeadressen_Validierung.ini ./Testsuite_DMAV/DMAV_Gebaeudeadressen_V1_1