name: DMAV-Bodenbedeckung

on:
  pull_request:
    types: [opened, closed]  
    
  workflow_dispatch: 

jobs:
  test-failcases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run DMAV_Bodenbedeckung_V1_1
        run: java -jar ./_Runner/ilivalidator-1.15.0/ilivalidator-1.15.1-INTERNAL-GEOWERKSTATT-SNAPSHOT.jar --config ./Testsuite_DMAV/DMAV_V1_1_Validierung_Alle_modelle.ini ./Testsuite_DMAV/DMAVTYM_Alles_V1_1.xtf